name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        default: v0.1.38

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Upload assets and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Format-Flow-Setup-$version.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/latest.yml"

          foreach ($asset in @($installer, $blockmap, $metadata)) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GH_REPO --verify-tag --draft `
              --title "Format Flow $env:RELEASE_TAG" `
              --notes "Windows installer and update metadata for Format Flow $env:RELEASE_TAG."
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create release for $env:RELEASE_TAG"
            }
          }

          gh release upload $env:RELEASE_TAG $installer $blockmap $metadata --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload release assets for $env:RELEASE_TAG"
          }

          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to publish release $env:RELEASE_TAG"
          }
