appId: com.songyu.formatflow.licensemanager
productName: Format Flow License Manager
artifactName: Format-Flow-License-Manager-Setup-${version}.${ext}
icon: resources/format-flow.ico
directories:
  output: release/license-manager
files:
  - tools/license-manager-app.cjs
  - tools/license-manager-preload.cjs
  - tools/license-manager.html
  - package.json
extraMetadata:
  main: tools/license-manager-app.cjs
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
