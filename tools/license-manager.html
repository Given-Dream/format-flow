<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Flow License Manager</title>
    <style>
      :root {
        color: #101828;
        background: #f5f7fb;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main { display: grid; place-items: center; min-height: 100vh; padding: 28px; }
      section { width: min(520px, 100%); padding: 30px; background: #fff; border: 1px solid #dfe4ec; border-radius: 8px; box-shadow: 0 16px 40px rgba(16, 24, 40, .1); }
      .mark { display: grid; width: 44px; height: 44px; place-items: center; color: #fff; font-weight: 800; background: #2563eb; border-radius: 8px; }
      h1 { margin: 18px 0 8px; font-size: 24px; }
      p { color: #667085; line-height: 1.55; }
      label { display: grid; gap: 8px; margin-top: 20px; color: #475467; font-size: 13px; font-weight: 600; }
      input { width: 100%; padding: 11px 12px; color: #101828; background: #fff; border: 1px solid #d0d5dd; border-radius: 6px; font: inherit; }
      textarea { width: 100%; min-height: 115px; padding: 11px 12px; resize: vertical; color: #101828; background: #f8fafc; border: 1px solid #d0d5dd; border-radius: 6px; font: 12px Consolas, monospace; line-height: 1.5; }
      .actions { display: flex; gap: 8px; margin-top: 20px; }
      button { padding: 10px 14px; color: #101828; background: #fff; border: 1px solid #d0d5dd; border-radius: 6px; font: inherit; cursor: pointer; }
      button:hover { background: #f8fafc; }
      button.primary { color: #fff; background: #2563eb; border-color: #2563eb; }
      button.primary:hover { background: #1d4ed8; }
      button:disabled { cursor: not-allowed; opacity: .5; }
      .status { margin: 18px 0 0; padding: 10px 12px; color: #667085; background: #f8fafc; border-radius: 6px; font-size: 12px; word-break: break-word; }
      .status.ready { color: #047857; background: #ecfdf3; }
      .status.error { color: #b42318; background: #fef3f2; }
      .footnote { margin-bottom: 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div class="mark">FF</div>
        <h1>Format Flow License Manager</h1>
        <p>输入用户提供的机器码，生成与该机器永久绑定的授权密码。</p>
        <label>
          用户机器码
          <input id="machineCode" autocomplete="off" placeholder="例如 FF-12345678-90ABCDEF-12345678-90ABCDEF" />
        </label>
        <label>
          永久授权密码
          <textarea id="password" readonly placeholder="生成后显示授权密码"></textarea>
        </label>
        <div class="actions">
          <button id="generate" class="primary" type="button">生成密码</button>
          <button id="copy" type="button" disabled>复制密码</button>
        </div>
        <p id="status" class="status">正在检查管理员私钥...</p>
        <p class="footnote">私钥只从管理员电脑的用户目录读取，不会写入生成结果，也不会进入普通用户安装包。</p>
      </section>
    </main>
    <script>
      const machineCode = document.getElementById('machineCode')
      const password = document.getElementById('password')
      const generate = document.getElementById('generate')
      const copy = document.getElementById('copy')
      const status = document.getElementById('status')

      function showStatus(message, kind = '') {
        status.textContent = message
        status.className = `status ${kind}`
      }

      window.licenseManager.getStatus().then((result) => {
        if (result.ready) {
          showStatus(`管理员私钥已就绪：${result.privateKeyPath}`, 'ready')
        } else {
          showStatus(`找不到管理员私钥：${result.privateKeyPath}`, 'error')
          generate.disabled = true
        }
      })

      generate.addEventListener('click', async () => {
        const result = await window.licenseManager.generatePassword(machineCode.value)
        password.value = result.password || ''
        copy.disabled = !result.password
        showStatus(result.message, result.ok ? 'ready' : 'error')
      })

      copy.addEventListener('click', async () => {
        if (!password.value) return
        await window.licenseManager.copyText(password.value)
        showStatus('授权密码已复制，可以发送给用户。', 'ready')
      })
    </script>
  </body>
</html>
